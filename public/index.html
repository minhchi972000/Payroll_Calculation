<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bảng lương</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="wrap">
    <p id="loading" class="muted">Đang tải…</p>

    <section id="login-view" class="card narrow" hidden>
      <h2>Xem bảng lương</h2>
      <p class="muted">Đăng nhập bằng số CCCD (đủ 12 số trên thẻ căn cước) của bạn. Mật khẩu là <b>6 số cuối số CCCD</b>, hoặc mật khẩu admin đã gửi cho bạn.</p>
      <form id="login-form" novalidate>
        <label for="login-id">Số CCCD</label>
        <input id="login-id" type="text" inputmode="numeric" pattern="[0-9]{12}" autocomplete="username"
          placeholder="12 chữ số" aria-describedby="login-id-count" required>
        <p id="login-id-count" class="field-hint">0/12 số</p>
        <label for="login-password">Mật khẩu</label>
        <div class="password">
          <input id="login-password" type="password" autocomplete="current-password" required>
          <button type="button" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </div>
        <button class="primary" type="submit">Đăng nhập</button>
        <p id="login-error" class="error" hidden></p>
      </form>
      <p class="muted">Quên mật khẩu? Liên hệ admin.</p>
    </section>

    <section id="payslip-view" hidden>
      <header class="top">
        <h1>Bảng lương</h1>
        <button id="logout" class="ghost" type="button">Đăng xuất</button>
      </header>

      <!-- Điện thoại: một cột. Laptop: cột trái (thông tin, thực lãnh) đứng yên, cột phải là chi tiết -->
      <div class="payslip-layout">
        <aside class="payslip-side">
          <div class="card">
            <div class="payslip-head">
              <div>
                <div id="emp-name" class="name"></div>
                <div id="emp-id" class="muted"></div>
                <div id="emp-info" class="muted"></div>
              </div>
            </div>
            <div id="period-wrap">
              <label for="period">Kỳ lương</label>
              <select id="period"></select>
            </div>
            <p id="no-payslip" class="notice" hidden>Chưa có bảng lương nào cho bạn.</p>
          </div>
          <div id="net" class="net" hidden>
            <div id="net-label" class="label"></div>
            <div id="net-value" class="value"></div>
          </div>
        </aside>

        <div id="payslip-card" class="card payslip-main" hidden>
          <div id="groups"></div>
          <button id="toggle-zero" class="link more" type="button" hidden></button>
          <p id="payslip-error" class="error" hidden></p>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
